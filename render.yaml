services:
  - type: web
    name: motion-only-api
    runtime: node
    region: frankfurt
    plan: starter
    rootDir: api
    buildCommand: npm ci --include=dev && npm run typecheck && npm run test:migrations
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: motion-only-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: motion-only-redis
          property: connectionString
      - key: APP_DEEP_LINK
        value: motiononly://auth
      - key: PUBLIC_APP_URL
        value: https://common-ground-circle.realworldjoel.chatgpt.site
      - key: WEB_APP_ORIGIN
        value: https://common-ground-circle.realworldjoel.chatgpt.site
      - key: SESSION_TTL_SECONDS
        value: "2592000"
      - key: MAGIC_LINK_TTL_SECONDS
        value: "900"
      - key: PASSWORD_RESET_TTL_SECONDS
        value: "900"
      - key: MAX_FILE_BYTES
        value: "10000000"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_FORCE_PATH_STYLE
        value: "false"

  - type: keyvalue
    name: motion-only-redis
    region: frankfurt
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

databases:
  - name: motion-only-postgres
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: motion_only
    user: motion_only
    ipAllowList: []
    storageAutoscalingEnabled: true
