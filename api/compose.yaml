services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: motion_only
      POSTGRES_USER: motion
      POSTGRES_PASSWORD: motion
    ports:
      - "5432:5432"
    volumes:
      - motion_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motion -d motion_only"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - motion_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: motion
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - motion_storage:/data

volumes:
  motion_postgres:
  motion_redis:
  motion_storage:
